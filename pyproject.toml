[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edumatch-ia"
version = "0.1.0"
description = "Moteur de matching explicable profil vers formation"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "shap>=0.45",
    "mlflow>=2.14",
    "great-expectations>=0.18",
    "evidently>=0.4",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "jupyter>=1.0"]
rag = ["langchain>=0.2", "langchain-community>=0.2", "faiss-cpu>=1.8",
       "sentence-transformers>=3.0", "mistralai>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["edumatch*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
