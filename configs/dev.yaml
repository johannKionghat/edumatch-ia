# Développement local. Hérite de base.yaml.
herite_de: base.yaml

donnees:
  parcoursup:
    millesimes: [2024, 2025]         # deux millésimes suffisent pour itérer
  echantillonnage: 0.10              # 10 % des lignes, itération rapide

modele:
