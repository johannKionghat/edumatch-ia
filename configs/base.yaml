# Configuration commune à tous les environnements.
# Les valeurs par environnement surchargent celles-ci.
# Aucun secret ici : les identifiants passent par des variables d'environnement.

projet:
  nom: edumatch-ia
  version: "0.1.0"

donnees:
  parcoursup:
    millesimes: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    effectif_minimal_cellule: 1      # sous ce seuil, la cellule est écartée
    # Identifiants du jeu de données par millésime sur le portail du MESR,
    # vérifiés le 2026-08-26 (voir docs/donnees.html).
    # La forme change d'une année à l'autre : tiret jusqu'en 2019, souligné à
    # partir de 2020, aucun suffixe pour le millésime en cours (2025).
    identifiants:
      2018: fr-esr-parcoursup-2018
      2019: fr-esr-parcoursup-2019
      2020: fr-esr-parcoursup_2020
      2021: fr-esr-parcoursup_2021
      2022: fr-esr-parcoursup_2022
      2023: fr-esr-parcoursup_2023
      2024: fr-esr-parcoursup_2024
      2025: fr-esr-parcoursup
    url_export_gabarit: >-
      https://data.enseignementsup-recherche.gouv.fr/api/explore/v2.1/catalog/datasets/{identifiant}/exports/csv?delimiter=%3B
    delimiteur: ";"
  sirene:
    fichiers: [StockEtablissement, StockEtablissementHistorique,
               StockUniteLegale, StockUniteLegaleHistorique]
    # Aucune URL de fichier ici : les liens Sirene changent chaque mois
    # (nouveau stock republié par l'INSEE). Seuls l'identifiant du jeu de
    # données et le gabarit de l'API du catalogue sont stables ; l'URL de
    # chaque fichier est résolue à l'exécution (voir ingestion/sirene.py).
    jeu_de_donnees: base-sirene-des-entreprises-et-de-leurs-etablissements-siren-siret
    url_catalogue_gabarit: >-
      https://www.data.gouv.fr/api/1/datasets/{jeu_de_donnees}/
    filtres:
      etat_administratif: A          # actifs uniquement
      caractere_employeur: true      # un non-employeur n'est pas un débouché
      diffusible: true
  referentiels:
    # ONISEP (IDÉO) : quatre jeux, URL de téléchargement fixes, vérifiées le
    # 2026-08-29. Licence ODbL (odc-odbl) — partage à l'identique obligatoire
    # sur toute base dérivée redistribuée, distincte de la Licence Ouverte.
    ideo:
      jeux:
        formations:
          url: https://api.opendata.onisep.fr/downloads/5fa591127f501/5fa591127f501.csv
          encodage: utf-8
          delimiteur: ";"
          licence: "ODbL (odc-odbl)"
        metiers:
          url: https://api.opendata.onisep.fr/downloads/5fa5949243f97/5fa5949243f97.csv
          encodage: utf-8
          delimiteur: ";"
          licence: "ODbL (odc-odbl)"
        structures_secondaire:
          url: https://api.opendata.onisep.fr/downloads/5fa5816ac6a6e/5fa5816ac6a6e.csv
          encodage: utf-8
          delimiteur: ";"
          licence: "ODbL (odc-odbl)"
        structures_superieur:
          url: https://api.opendata.onisep.fr/downloads/5fa586da5c4b6/5fa586da5c4b6.csv
          encodage: utf-8
          delimiteur: ";"
          licence: "ODbL (odc-odbl)"
    # RNCP/RS : aucune URL de fichier ici, l'export est republié chaque jour
    # (voir ingestion/referentiels.py pour la résolution et le choix
    # d'idempotence par date de publication). Licence Ouverte v2.0, distincte
    # de l'ODbL d'ONISEP.
    rncp:
      jeu_de_donnees: repertoire-national-des-certifications-professionnelles-et-repertoire-specifique
      url_catalogue_gabarit: >-
        https://www.data.gouv.fr/api/1/datasets/{jeu_de_donnees}/
      prefixe_ressource: "export-fiches-csv-"
      format_ressource: zip
      nom_fichier_gabarit: "export_fiches_CSV_Standard_*.csv"
      # Membre de la même archive que la fiche RNCP -> codes ROME. Vérifié le
      # 2026-08-30 en listant les membres réels de l'archive du jour (voir
      # docs/donnees.html) : présent aux côtés du CSV
      # standard, du fichier Nsf, et de sept autres membres non retenus ici.
      nom_fichier_rome_gabarit: "export_fiches_CSV_Rome_*.csv"
      # Vérifié le 2026-08-29 par décodage effectif du fichier téléchargé :
      # l'export est en UTF-8. À surveiller à chaque exécution (voir
      # ingestion/referentiels.py, qui rejette explicitement un fichier qui
      # ne décoderait pas selon cette valeur plutôt que de la supposer figée.
      encodage: utf-8
      delimiteur: ";"
      licence: "Licence Ouverte v2.0"
    # France Travail (ex-Pôle emploi) : la seule table publique trouvée qui
    # relie directement un code ROME à la nomenclature NAF — au niveau
    # division (2 chiffres), pas à la sous-classe complète utilisée par
    # Sirene. Vérifiée le 2026-08-30 : dataset data.gouv
    # 58da857388ee384902e505f5, ressource "Les tables de correspondance
    # ROME / autres référentiels - ROME/NAF", licence Licence Ouverte
    # ("fr-lo" dans le catalogue). Voir naf_rome_formation.py pour la mesure
    # de couverture et la troncature du NAF Sirene à sa division.
    france_travail:
      jeu_de_donnees: 58da857388ee384902e505f5
      url_catalogue_gabarit: >-
        https://www.data.gouv.fr/api/1/datasets/{jeu_de_donnees}/
      sous_chaine_titre_ressource: "ROME/NAF"
      format_ressource: xlsx
      licence: "Licence Ouverte v2.0"
  # Tailles cibles des échantillons versionnés de data/samples/ — un
  # jeu figé, distinct de `echantillonnage` ci-dessus, qui ne sert qu'à
  # faire tourner les tests sans télécharger les sources complètes.
  echantillons_test:
    lignes_par_millesime_parcoursup: 40
    lignes_par_fichier_sirene: 500
    lignes_par_jeu_ideo: 300
    lignes_rncp: 300
    taille_lot_sirene: 200000

modele:
  type: lightgbm
  objectif: regression_proportion
  ponderation: effectif_cellule      # une cellule de 3 ne vaut pas une de 500
  # Décision de variables (adr/0013). Cette section est la référence unique
  # de la construction des variables : elle classe les 128 colonnes vues au
  # moins une fois dans les huit millésimes Parcoursup, sans exception.
  #
  # Protection anti-fuite par LISTE BLANCHE, et non par liste d'exclusion :
  # seules les colonnes de `session_courante` sont lues sur la session
  # prédite. Toutes les autres — compteurs de vœux, propositions, admis,
  # rangs, taux d'accès — ne sont lisibles que sur la session précédente
  # (`decalees`), car aucune d'elles n'existe au moment où un lycéen
  # formule ses vœux. Une colonne oubliée est exclue par défaut, jamais admise
  # par défaut.
  variables:
    # Colonnes de jointure et de partition, jamais données au modèle comme
    # variables. `lien_form_psup` ne sert qu'à reconstruire `cod_aff_form`
    # sur les millésimes 2018 et 2019, où la colonne est absente (adr/0010).
    cles:
      - session
      - cod_aff_form
      - lien_form_psup
    # Dimensions de la cellule prédite. Elles ne viennent pas d'une colonne :
    # elles sont portées par la structure du label (adr/0009), qui décline
    # chaque formation en type de baccalauréat et statut de boursier.
    dimensions_cellule:
      - type_bac
      - boursier
    # Attributs de catalogue, publiés et consultables au moment où le lycéen
    # formule ses vœux : ce sont les SEULES colonnes lues sur la session
    # prédite.
    session_courante:
      - fili
      - fil_lib_voe_acc
      - form_lib_voe_acc
      - select_form
      - contrat_etab
      - tri
      - dep
      - acad_mies
      - region_etab_aff
    # Résultats de la session précédente. Le fichier du millésime N-1 est en
    # ligne quand s'ouvre la campagne N (millésime 2024 publié le 16/01/2025).
    # Conséquence à assumer : `prop_tot_*` n'existant pas avant 2020, ces
    # variables sont vides pour la session d'entraînement 2020.
    decalees:
      - capa_fin
      - voe_tot
      - nb_voe_pp
      - nb_voe_pp_bg
      - nb_voe_pp_bg_brs
      - nb_voe_pp_bt
      - nb_voe_pp_bt_brs
      - nb_voe_pp_bp
      - nb_voe_pp_bp_brs
      - nb_cla_pp
      - nb_cla_pp_bg
      - nb_cla_pp_bg_brs
      - nb_cla_pp_bt
      - nb_cla_pp_bt_brs
      - nb_cla_pp_bp
      - nb_cla_pp_bp_brs
      - prop_tot
      - prop_tot_bg
      - prop_tot_bg_brs
      - prop_tot_bt
      - prop_tot_bt_brs
      - prop_tot_bp
      - prop_tot_bp_brs
      - acc_tot
      - acc_bg
      - acc_bt
      - acc_bp
      - acc_brs
      - acc_neobac
      - acc_aca_orig
      - acc_aca_orig_idf
      - acc_debutpp
      - acc_datebac
      - acc_finpp
      - ran_grp1
    # Variables de mention, décalées elles aussi, mais contaminées par le
    # baccalauréat en contrôle continu de 2020 : lues sur N-1, elles altèrent
    # les sessions cibles 2021 et 2022, soit la moitié de l'entraînement.
    # Écartées par défaut, réintroduites seulement si l'ablation le justifie.
    decalees_sous_reserve:
      - acc_mention_nonrenseignee
      - acc_sansmention
      - acc_ab
      - acc_b
      - acc_tb
      - acc_bg_mention
      - acc_bt_mention
      - acc_bp_mention
    exclues:
      voe_tot_f: interdite
      acc_tot_f: interdite
      acc_term_f: interdite
      pct_f: interdite
      cod_uai: substitut
      g_olocalisation_des_formations: substitut
      ville_etab: substitut
      regr_forma: instabilite
      rang_der_max: instabilite
      pct_etab_orig: instabilite
      lib_grp4: instabilite
      ran_grp4: instabilite
      lib_grp5: instabilite
      ran_grp5: instabilite
      taux_adm_psup: instabilite
      taux_adm_psup_pro: instabilite
      taux_adm_psup_gen: instabilite
      taux_adm_psup_techno: instabilite
      lib_for_voe_ins: instabilite
      detail_forma2: instabilite
      acc_tbf: instabilite
      pct_tbf: instabilite
      list_com: instabilite
      etablissement_id_paysage: instabilite
      composante_id_paysage: instabilite
      taux_acces_ens: instabilite
      part_acces_gen: instabilite
      part_acces_tec: instabilite
      part_acces_pro: instabilite
      lib_comp_voe_ins: cardinalite
      detail_forma: completude
      nb_voe_pp_internat: completude
      nb_cla_pp_internat: completude
      nb_cla_pp_pasinternat: completude
      acc_internat: completude
      acc_term: completude
      lib_grp2: completude
      ran_grp2: completude
      lib_grp3: completude
      ran_grp3: completude
      nb_voe_pp_at: hors_perimetre
      nb_voe_pc: hors_perimetre
      nb_voe_pc_bg: hors_perimetre
      nb_voe_pc_bt: hors_perimetre
      nb_voe_pc_bp: hors_perimetre
      nb_voe_pc_at: hors_perimetre
      nb_cla_pc: hors_perimetre
      nb_cla_pp_at: hors_perimetre
      acc_at: hors_perimetre
      prop_tot_at: hors_perimetre
      g_ea_lib_vx: redondance
      dep_lib: redondance
      acc_pp: redondance
      acc_pc: redondance
      pct_aca_orig: redondance
      pct_aca_orig_idf: redondance
      pct_bours: redondance
      pct_neobac: redondance
      pct_mention_nonrenseignee: redondance
      pct_sansmention: redondance
      pct_ab: redondance
      pct_b: redondance
      pct_tb: redondance
      pct_bg: redondance
      pct_bg_mention: redondance
      pct_bt: redondance
      pct_bt_mention: redondance
      pct_bp: redondance
      pct_bp_mention: redondance
      pct_acc_debutpp: redondance
      pct_acc_datebac: redondance
      pct_acc_finpp: redondance
      lib_grp1: redondance
  split:
    # Le numérateur du label ventilé par type de baccalauréat
    # (prop_tot_{bg|bt|bp}) n'existe qu'à partir de la session 2020 : les
    # sessions 2018 et 2019 n'ont pas de cible et ne peuvent donc pas servir
    # à l'entraînement. Voir adr/0012.
    entrainement: [2020, 2021, 2022, 2023]
    validation: [2024]
    test: [2025]                     # touché UNE SEULE FOIS, à la fin
  hyperparametres:
    num_leaves: 31
    max_depth: 8
    learning_rate: 0.05
    min_child_samples: 20
    reg_alpha: 0.1
    reg_lambda: 0.1
    n_estimators: 2000
    early_stopping_rounds: 100
  # Le taux de la session précédente (la baseline mesurée) donné au
  # modèle comme variable explicite, plutôt que laissé comme seul concurrent.
  # Un ensemble d'arbres n'apprend pas nativement une division : sans cette
  # variable, il ne dispose que du numérateur et du dénominateur séparés
  # (`prop_tot_*` / `nb_voe_pp_*`, déjà dans `decalees` ci-dessus) et doit
  # approximer leur quotient par des coupures successives. Activé après
  # mesure sur la seule validation 2024 (jamais le test) : voir le compte
  # rendu de l'étape pour le chiffre qui a tranché.
  inclure_taux_precedent: true
  # Options de variante issues de la sélection pré-enregistrée (ADR 0021,
  # src/edumatch/models/selection.py). Les valeurs ci-dessous reproduisent le
  # modèle documenté et enregistré (v1) : la configuration du dépôt décrit ce
  # qui est servi, pas un candidat.
  # Le candidat C-h2 / isotonique_globale (demi_vie_recence 2, cible ecart,
  # calibration isotonique_globale, n_estimators_fige 413) a été refusé par la
  # porte de promotion le 18 septembre 2026 ; sa recette est consignée dans
  # l'ADR 0021 et dans MLflow. Un futur réentraînement ne repartira de lui que
  # si une décision écrite le prévoit — jamais par un défaut silencieux que la
  # porte refuserait à chaque exécution.
  variante:
    demi_vie_recence: null      # null = aucune décroissance de récence du poids
    cible: taux                  # "taux" (modèle v1) ou "ecart" (taux - ancre baseline)
    calibration: aucune          # "aucune" (modèle v1) ou "isotonique_globale"
    n_estimators_fige: null     # null = arrêt anticipé sur la validation (modèle v1)

evaluation:
  metrique_principale: mae_ponderee
  calibration: true
  # 10 tranches de 0,1 sur [0, 1] : assez fin pour distinguer les deux masses
  # aux bornes du label (taux nul, taux à 1 — ADR 0009) sans multiplier les
  # tranches quasi vides sur 77 159 cellules par millésime.
  n_tranches_calibration: 10
  courbe_apprentissage: [0.10, 0.25, 0.50, 1.00]
  baseline: taux_session_precedente
  # Plancher AIPD sur l'ECE de test (ADR 0021 point 5) : conjonction avec la
  # MAE dans la porte de promotion, jamais l'une sans l'autre.
  seuil_ece_test: 0.0322

# Seuils des contrôles qualité (src/edumatch/quality/). Un contrôle qui
# journalise sans bloquer laisse une donnée corrompue atteindre le modèle
# — c'est le cinquième des principes que je me suis fixés pour ce dépôt :
# les données se valident comme du code. La distinction entre ce qui bloque et
# ce qui avertit est dans le code des contrôles, pas ici — cette section ne
# porte que les seuils numériques, mesurés sur les fichiers sources réels.
qualite:
  parcoursup:
    seuil_completude: 0.99
    tolerance_reconstruction_pourcentage: 0.5
    age_max_jours_avertissement: 400
  sirene:
    seuil_completude: 0.99
    age_max_jours_avertissement: 60
  referentiels:
    seuil_completude: 0.99
    age_max_jours_avertissement_ideo: 200
    age_max_jours_avertissement_rncp: 3

equite:
  dimensions: [type_bac, boursier, genre, territoire]
  variables_interdites: [genre]      # audit a posteriori uniquement
  substituts_a_tester: [academie, etablissement_origine]
  seuil_impact_disparate: 0.80       # règle des quatre cinquièmes

# Seuils de reconsidération de l'ablation (adr/0013). Le seul retrait
# dont la décision (ADR 0013) fixe un seuil chiffré est celui des mentions ;
# celui de cod_uai se déclenche dès qu'une perte est mesurée, sans valeur à
# régler (voir `models/ablation.py`).
ablation:
  seuil_gain_mentions: 0.01

explicabilite:
  top_n_figure: 15                   # variables affichées sur le diagramme d'importance globale
  effectif_minimal_exemple: 30       # même plancher que l'analyse d'équité : sous ce seuil, une
                                      # cellule ne dit rien de stable pour servir d'exemple commenté

# Score à trois termes : affinité x accessibilité x débouchés.
# Voir src/edumatch/matching/ pour le détail de chaque terme et
# src/edumatch/config.py (MatchingConfig) pour la justification de chaque
# valeur ci-dessous.
matching:
  k_anonymat_debouches: 5                  # tranché par la gouvernance (docs/risques-aipd.html, R2)
  # Repère, pas une valeur mesurée : la médiane des cellules département x
  # division NAF conservées après k-anonymat est de 71 établissements
  # (25e centile 23, 75e centile 291, sur data/processed/matching/
  # agregat_debouches_departement.parquet) — 100 place donc la moitié des
  # cellules mesurées sous la saturation, l'autre moitié au-dessus,
  # plutôt qu'un seuil trop bas qui saturerait la quasi-totalité des
  # cellules à 1,0 et rendrait le terme peu discriminant.
  seuil_saturation_etablissements: 100
  facteur_territoire_hors_zone: 0.6        # atténuation, jamais une exclusion

# Assistant documentaire, brique secondaire : voir RagConfig dans
# src/edumatch/config.py pour la justification de chaque valeur.
rag:
  jeux_indexes: [formations, metiers]
  top_k: 4
  seuil_similarite_minimale: 0.05
  modele_generation: mistral-small-latest

# Détection de dérive (src/edumatch/models/derive.py). Seuil et granularité
# arrêtés par l'ADR 0018, sur la mesure réelle des six sessions labellisées
# (2020-2025, ADR 0012) : voir l'ADR pour le détail par famille de dérive
# (variables, cible, prédictions) et pour la raison du regroupement en
# catégories (top_k_categories_psi) plutôt qu'un PSI par modalité brute.
derive:
  reference: distribution_entrainement
  tests: [psi, kolmogorov_smirnov]
  seuil_reentrainement: 0.20         # PSI au-delà duquel on réentraîne (médiane des variables, ADR 0018)
  n_tranches_psi: 10                 # même granularité que evaluation.n_tranches_calibration
  top_k_categories_psi: 30           # au-delà, catégories les moins fréquentes regroupées sous "autre"

# Orchestration du DAG (Airflow). Les tâches enchaînent exactement la
# chaîne déjà portée par le Makefile (make data, make sirene-agregats,
# make naf-rome, make audit-purge-appliquer) ; ce bloc ne porte que les
# paramètres de reprise et de planification, jamais un seuil métier.
orchestration:
  # Un premier essai plus deux reprises : au-delà, une coupure réseau ou un
  # quota indisponible depuis trois tentatives n'est plus un incident
  # transitoire à absorber seul, c'est une panne à faire remonter (voir
  # src/edumatch/orchestration/reprise.py).
  tentatives_max: 3
  # Délai avant la première reprise, multiplié par facteur_backoff à chaque
  # tentative suivante (60 s, puis 120 s) : assez court pour ne pas
  # allonger inutilement une reprise après une coupure réseau brève, assez
  # long pour laisser respirer un service en quota plutôt que de le
  # marteler à la même cadence.
  delai_reprise_secondes: 60
  facteur_backoff: 2.0
  # Cadence de chaque chaîne, alignée sur la fraîcheur réelle de chaque
  # source (voir qualite.*.age_max_jours_avertissement ci-dessus, mesurée
  # sur les fichiers sources) : Parcoursup publie une campagne par an,
  # Sirene republie son stock chaque mois, l'export RNCP est quotidien. La
  # purge du journal d'audit (article 12) est planifiée à la même
  # cadence que les référentiels : une durée de conservation qu'aucune
  # tâche planifiée n'applique n'est pas une durée, c'est une intention.
  planification:
    parcoursup: "@yearly"
    sirene: "@monthly"
    referentiels: "@daily"
    purge_audit: "@daily"

api:
  slo_latence_p95_ms: 300
  # Plafond du sous-catalogue scoré par requête /matching, fixé sur la mesure
  # (scripts/bench_matching.py, résultat dans reports/bench-matching.json) : il couvre le
  # plus gros département réel du catalogue 2025, le 75 (1 010 formations pour la cellule
  # bac général, non boursier), dont le p95 mesuré en local est de 844 ms de bout en bout,
  # authentification comprise. Ce plafond ne tient donc PAS le SLO de 300 ms : il borne le
  # coût d'une requête, il ne le garantit pas (voir docs/service.html#api-degradation).
  # La France entière (13 685 formations) reste refusée, avec un 422 explicite.
  max_formations_evaluees: 1100
  top_n_max: 50                      # plafond du nombre de recommandations demandables
  # Revue de sécurité : fenêtre glissante de 60 s, par adresse IP sur /matching et par
  # identifiant de conseiller authentifié sur /feedback (src/edumatch/api/rate_limit.py).
  limite_requetes_par_minute: 120
  # Journal d'inférence article 12 : conciliation avec le plafond du RGPD (art. 5.1.e),
  # voir docs/registres.html T5 et src/edumatch/config.py:AuditConfig.
  audit:
    delai_pseudonymisation_jours: 365    # 12 mois — palier 1 -> 2
    delai_agregation_jours: 1095         # 36 mois (365 x 3) — palier 2 -> 3
