# Configuration commune à tous les environnements.
# Les valeurs par environnement surchargent celles-ci.
# Aucun secret ici : les identifiants passent par des variables d'environnement.

projet:
  nom: edumatch-ia
  version: "0.1.0"

donnees:
  parcoursup:
    millesimes: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    effectif_minimal_cellule: 1      # sous ce seuil, la cellule est écartée
    # Identifiants du jeu de données par millésime sur le portail du MESR,
    # vérifiés le 2026-08-26 (voir docs/sous-docs-projets/01-donnees/sources.md).
    # La forme change d'une année à l'autre : tiret jusqu'en 2019, souligné à
    # partir de 2020, aucun suffixe pour le millésime en cours (2025).
    identifiants:
      2018: fr-esr-parcoursup-2018
      2019: fr-esr-parcoursup-2019
      2020: fr-esr-parcoursup_2020
      2021: fr-esr-parcoursup_2021
      2022: fr-esr-parcoursup_2022
      2023: fr-esr-parcoursup_2023
      2024: fr-esr-parcoursup_2024
      2025: fr-esr-parcoursup
    url_export_gabarit: >-
      https://data.enseignementsup-recherche.gouv.fr/api/explore/v2.1/catalog/datasets/{identifiant}/exports/csv?delimiter=%3B
    delimiteur: ";"
  sirene:
    fichiers: [StockEtablissement, StockEtablissementHistorique,
               StockUniteLegale, StockUniteLegaleHistorique]
    # Aucune URL de fichier ici : les liens Sirene changent chaque mois
    # (nouveau stock republié par l'INSEE). Seuls l'identifiant du jeu de
    # données et le gabarit de l'API du catalogue sont stables ; l'URL de
    # chaque fichier est résolue à l'exécution (voir ingestion/sirene.py).
    jeu_de_donnees: base-sirene-des-entreprises-et-de-leurs-etablissements-siren-siret
    url_catalogue_gabarit: >-
      https://www.data.gouv.fr/api/1/datasets/{jeu_de_donnees}/
    filtres:
      etat_administratif: A          # actifs uniquement
      caractere_employeur: true      # un non-employeur n'est pas un débouché
      diffusible: true

modele:
  type: lightgbm
  objectif: regression_proportion
  ponderation: effectif_cellule      # une cellule de 3 ne vaut pas une de 500
  split:
    entrainement: [2018, 2019, 2020, 2021, 2022, 2023]
    validation: [2024]
    test: [2025]                     # touché UNE SEULE FOIS, à la fin
  hyperparametres:
    num_leaves: 31
    max_depth: 8
    learning_rate: 0.05
    min_child_samples: 20
    reg_alpha: 0.1
    reg_lambda: 0.1
    n_estimators: 2000
    early_stopping_rounds: 100

evaluation:
  metrique_principale: mae_ponderee
  calibration: true
  courbe_apprentissage: [0.10, 0.25, 0.50, 1.00]
  baseline: taux_session_precedente

equite:
  dimensions: [type_bac, boursier, genre, territoire]
  variables_interdites: [genre]      # audit a posteriori uniquement
  substituts_a_tester: [academie, etablissement_origine]
  seuil_impact_disparate: 0.80       # règle des quatre cinquièmes

derive:
  reference: distribution_entrainement
  tests: [psi, kolmogorov_smirnov]
  seuil_reentrainement: 0.20         # PSI au-delà duquel on réentraîne

api:
  slo_latence_p95_ms: 300
